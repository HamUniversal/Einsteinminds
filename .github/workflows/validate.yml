name: Validate Einsteinminds

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, upgrade/resource-network-v1, upgrade/resource-network-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: einsteinminds-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check assets/resource-network-core.js
          node --check assets/einsteinminds-resource-network.js
          node --check assets/auth-route-guard.js
          node --check scripts/apply-update.mjs
          node --check scripts/validate-release.mjs
      - name: Check inline application JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = []
          pattern = re.compile(r'<script(?![^>]*\\bsrc=)([^>]*)>([\\s\\S]*?)</script>', re.I)
          for index, match in enumerate(pattern.finditer(html)):
              attrs, body = match.group(1).lower(), match.group(2)
              if 'application/ld+json' in attrs or 'application/json' in attrs or not body.strip():
                  continue
              suffix = '.mjs' if 'type="module"' in attrs or "type='module'" in attrs else '.js'
              target = Path('/tmp') / f'einsteinminds-inline-{index}{suffix}'
              target.write_text(body, encoding='utf-8')
              scripts.append(str(target))
          Path('/tmp/einsteinminds-inline-scripts.txt').write_text('\\n'.join(scripts), encoding='utf-8')
          print(f'Extracted {len(scripts)} inline script block(s).')
          PY
          while IFS= read -r file; do
            [ -z "$file" ] || node --check "$file"
          done < /tmp/einsteinminds-inline-scripts.txt
      - name: Run tests
        run: node --test tests/*.test.cjs
      - name: Validate release contents
        run: node scripts/validate-release.mjs
