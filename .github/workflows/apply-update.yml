name: Apply Einsteinminds resource update

on:
  push:
    branches: [upgrade/resource-network-v1]

permissions:
  contents: write

concurrency:
  group: einsteinminds-apply-resource-update
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/resource-network-v1
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply update to existing application
        run: node scripts/apply-update.mjs
      - name: Check JavaScript syntax
        run: |
          node --check assets/resource-network-core.js
          node --check assets/einsteinminds-resource-network.js
          node --check scripts/apply-update.mjs
          node --check scripts/validate-release.mjs
      - name: Run tests
        run: node --test tests/*.test.cjs
      - name: Validate release
        run: node scripts/validate-release.mjs
      - name: Commit reviewed application update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No application changes to commit."
          else
            git commit -m "Apply Einsteinminds resource network update"
            git push origin HEAD:upgrade/resource-network-v1
          fi
